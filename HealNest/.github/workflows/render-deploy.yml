name: Trigger Render Deploy (Backend)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy via API
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          BRANCH: main
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "Missing Render secrets. Please set RENDER_API_KEY and RENDER_SERVICE_ID in repository secrets.";
            exit 1;
          fi
          echo "Triggering deploy for service $RENDER_SERVICE_ID (branch $BRANCH)"
          curl -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"clearCache\":true, \"branch\": \"$BRANCH\"}" \
            https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys

# Required repository secrets:
# - RENDER_API_KEY
# - RENDER_SERVICE_ID
