<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>HealNest</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Dynamically load built CSS & JS using Vite build manifest
      (async function(){
        try{
          const res = await fetch('/build/manifest.json');
          if(!res.ok) throw new Error('manifest not found');
          const manifest = await res.json();
          // load CSS if present
          const cssEntry = manifest['resources/css/app.css'] && manifest['resources/css/app.css'].file;
          if(cssEntry){
            const l = document.createElement('link');
            l.rel = 'stylesheet';
            l.href = '/build/' + cssEntry;
            document.head.appendChild(l);
          }
          // load JS entry (module)
          const jsEntry = manifest['resources/js/app.js'] && manifest['resources/js/app.js'].file;
          if(jsEntry){
            const s = document.createElement('script');
            s.type = 'module';
            s.src = '/build/' + jsEntry;
            document.body.appendChild(s);
          } else {
            console.error('JS entry not found in manifest');
          }
        }catch(err){
          console.error('Error loading assets', err);
        }
      })();
    </script>
  </body>
</html>
