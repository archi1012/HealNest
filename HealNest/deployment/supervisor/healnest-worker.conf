; Supervisor config for Laravel queue worker (adjust paths and user)
[program:healnest-worker]
process_name=%(program_name)s
command=php /var/www/healnest/current/artisan queue:work --sleep=3 --tries=3 --timeout=90
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/healnest/current/storage/logs/worker.log
